<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1a21">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="G&amp;G Planner">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
</style>
<title>G&amp;G Post Planner</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Deep midnight-teal, always dark so it stays easy on the eyes at night. Mint = Instagram + accent, amber = TikTok.
   Layout: wordmark, two tabs. Calendar = wall-calendar month grid + selected-day panel. Checklist = today card, then every day in order. */
:root {
  --bg: #0f1a21;
  --surface: #172631;
  --ink: #e4edf0;
  --muted: #8ba3ad;
  --line: #243746;
  --accent: #4fd1b0;
  --accent-ink: #062018;
  --tt: #f2b866;
  --ig: #4fd1b0;
  --font-display: "Figtree", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
  background: var(--bg);
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body);
  font-size: 15px; line-height: 1.45;
  padding-block: 18px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
html { -webkit-text-size-adjust: 100%; }
button { font: inherit; color: inherit; -webkit-appearance: none; appearance: none; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
.wrap { max-width: 560px; margin: 0 auto; display: grid; gap: 18px; }
.mark { font-weight: 700; font-size: 18px; letter-spacing: .14em; text-transform: uppercase; text-align: center; }
.mark small { display: block; font-size: 11px; font-weight: 600; letter-spacing: .22em; color: var(--accent); margin-top: 2px; }
.tabs { display: grid; grid-template-columns: 1fr 1fr; background: var(--line); border-radius: 99px; padding: 4px; gap: 4px; }
.tabs button { border: 0; background: transparent; padding: 9px 12px; border-radius: 99px; font-weight: 600; font-size: 14px; color: var(--muted); cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.35); }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 2px; }

/* calendar */
.cal { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 14px 10px 10px; display: grid; gap: 10px; }
.cal-head { display: grid; grid-template-columns: 40px 1fr 40px; align-items: center; }
.cal-head h2 { margin: 0; text-align: center; font-size: 22px; font-weight: 700; letter-spacing: .01em; }
.cal-head h2 span { display: block; font-size: 12px; font-weight: 600; letter-spacing: .18em; color: var(--muted); }
.nav { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: transparent; cursor: pointer; font-size: 18px; color: var(--ink); }
.nav:disabled { opacity: .3; cursor: default; }
.grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
.dow { text-align: center; font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 6px 0; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.cell { aspect-ratio: 1 / 1.1; border: 0; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); background: transparent; padding: 5px 3px 4px; display: grid; grid-template-rows: auto 1fr auto; justify-items: center; cursor: pointer; min-width: 0; }
.cell.blank { cursor: default; }
.cell .n { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; }
.cell.off { color: var(--muted); opacity: .45; }
.cell.in { background: color-mix(in srgb, var(--accent) 7%, transparent); }
.cell.today .n { border: 2px solid var(--accent); }
.cell.sel .n { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.dots { display: flex; gap: 4px; align-self: end; }
.dot { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid; }
.dot.tt { border-color: var(--tt); } .dot.ig { border-color: var(--ig); }
.dot.tt.on { background: var(--tt); } .dot.ig.on { background: var(--ig); }
.cell .flag { font-size: 9px; font-weight: 700; letter-spacing: .04em; color: var(--accent); align-self: center; }
.legend { display: flex; gap: 14px; justify-content: center; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; gap: 6px; align-items: center; }

/* day cards */
.day { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px; display: grid; gap: 12px; }
.day.today { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 22%, transparent); }
.day.past { opacity: .6; }
.day-title { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.day-title b { font-size: 17px; }
.day-title span { font-size: 12px; color: var(--accent); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.slot { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; align-items: start; }
.chk { width: 34px; height: 34px; border-radius: 11px; border: 2px solid var(--accent); background: transparent; color: var(--accent-ink); font-size: 19px; line-height: 1; cursor: pointer; display: grid; place-items: center; padding: 0; }
.chk[aria-pressed="true"] { background: var(--accent); }
.meta { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.tag { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .06em; padding: 2px 9px; border-radius: 99px; border: 1px solid currentColor; }
.tag.tt { color: var(--tt); } .tag.ig { color: var(--ig); }
.meta input[type=time] { font: inherit; font-size: 16px; min-height: 32px; font-weight: 600; color: var(--ink); background: transparent; border: 0; border-bottom: 1px dashed var(--muted); padding: 2px 0; width: 7.4em; }
.label { width: 100%; font: inherit; font-size: 16px; -webkit-appearance: none; appearance: none; border-radius: 0; color: var(--ink); background: transparent; border: 0; border-bottom: 1px solid var(--line); padding: 5px 0; margin-top: 4px; }
.label::placeholder { color: var(--muted); }
.slot.done .label { text-decoration: line-through; color: var(--muted); }
.extra { font-size: 13px; color: var(--muted); }

/* checklist */
.head-row { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { height: 7px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); transition: width .3s; }
.stack { display: grid; gap: 10px; }
.week-h { margin: 8px 0 0; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.week-top { display: flex; justify-content: space-between; align-items: baseline; }
.week-top h2 { margin: 0; font-size: 22px; }
.week-top span { color: var(--muted); font-size: 13px; }
.pre { text-align: center; color: var(--muted); font-size: 14px; }
#status { font-size: 12px; color: var(--muted); text-align: center; min-height: 1em; }
</style>

</head>
<body>
<div class="wrap">
  <div class="mark">Girls for the Girls<small>Post Planner</small></div>
  <div class="tabs" role="tablist">
    <button type="button" role="tab" id="tab-cal" data-tab="cal" aria-selected="true">Calendar</button>
    <button type="button" role="tab" id="tab-list" data-tab="list" aria-selected="false">Daily</button>
  </div>
  <div id="view"></div>
  <div id="status" aria-live="polite"></div>
</div>

<script>
(function () {
  var START = [2026, 9, 18], DAYS = 28; // Sunday Oct 18, 2026 through Sat Nov 14
  var PLAN = { 0: ["09:00", "20:00"], 1: ["13:00", "18:00"], 2: ["12:00", "18:00"], 3: ["12:00", "12:00"],
               4: ["18:00", "12:00"], 5: ["18:00", "18:00"], 6: ["17:00", "17:00"] };
  var EXTRA = {
    "2026-10-18": "Launch day. Upload 3 carousels on each app.",
    "2026-10-23": "Change the TikTok handle to the .co version.",
    "2026-10-25": "Batch day. Make next week's carousels and schedule them.",
    "2026-11-01": "Batch day. Make next week's carousels and schedule them.",
    "2026-11-08": "Batch day. Make next week's carousels and schedule them.",
    "2026-11-14": "Last day of month one. Check TikTok Studio and Instagram Insights."
  };
  var WD = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  var WD3 = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  var MN = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  var MONTHS = [[2026, 9], [2026, 10]];

  function pad(n) { return String(n).padStart(2, "0"); }
  function isoOf(y, m, d) { return y + "-" + pad(m + 1) + "-" + pad(d); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function fmt12(t) { var h = +t.slice(0, 2), ap = h >= 12 ? "PM" : "AM"; return (h % 12 || 12) + ":" + t.slice(3) + " " + ap; }

  var days = [], byIso = {};
  for (var i = 0; i < DAYS; i++) {
    var d = new Date(START[0], START[1], START[2] + i);
    var o = { d: d, iso: isoOf(d.getFullYear(), d.getMonth(), d.getDate()), idx: i };
    days.push(o); byIso[o.iso] = o;
  }
  var now = new Date(), TODAY = isoOf(now.getFullYear(), now.getMonth(), now.getDate());

  var state = { done: {}, time: {}, label: {} };
  var ui = { tab: "cal", mi: 0, sel: days[0].iso };
  if (byIso[TODAY]) { ui.sel = TODAY; ui.mi = byIso[TODAY].d.getMonth() === 9 ? 0 : 1; }

  function slotsFor(day) {
    var pl = PLAN[day.d.getDay()];
    return [{ key: day.iso + "-tt", plat: "tt", name: "TikTok", def: pl[0] },
            { key: day.iso + "-ig", plat: "ig", name: "Instagram", def: pl[1] }];
  }

  // ---- saving ----
  var docRef = null, timer = null, busy = false, dirty = false;
  function setStatus(t) { var e = document.getElementById("status"); if (e) e.textContent = t; }
  function lsRead() { try { var s = localStorage.getItem("gg-planner"); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
  function lsWrite() { try { localStorage.setItem("gg-planner", JSON.stringify(state)); } catch (e) {} }
  function adopt(s) { s = s || {}; state = { done: s.done || {}, time: s.time || {}, label: s.label || {} }; }
  function queueSave() { lsWrite(); dirty = true; clearTimeout(timer); timer = setTimeout(flush, 500); }
  function flush() {
    if (!docRef || busy || !dirty) return Promise.resolve();
    busy = true; dirty = false;
    return docRef.set(JSON.parse(JSON.stringify(state)))
      .then(function () { setStatus(""); }, function () { setStatus("Saved on this device only"); })
      .then(function () { busy = false; if (dirty) flush(); });
  }

  // ---- pieces ----
  function slotHTML(s) {
    var t = state.time[s.key] || s.def, done = !!state.done[s.key];
    return '<div class="slot' + (done ? " done" : "") + '">' +
      '<button class="chk" type="button" data-k="' + s.key + '" aria-pressed="' + done + '" aria-label="Mark ' + s.name + ' post done">' + (done ? "&#10003;" : "") + "</button>" +
      '<div><div class="meta"><span class="tag ' + s.plat + '">' + s.name + "</span>" +
      '<input type="time" data-t="' + s.key + '" value="' + esc(t) + '" aria-label="' + s.name + ' time"></div>' +
      '<input class="label" type="text" data-l="' + s.key + '" value="' + esc(state.label[s.key] || "") + '" placeholder="Which carousel?" aria-label="' + s.name + ' carousel"></div></div>';
  }
  function dayCard(day, titleOverride) {
    var cls = "day" + (day.iso === TODAY ? " today" : "") + (day.iso < TODAY ? " past" : "");
    var tag = day.iso === TODAY ? "Today" : "";
    var title = titleOverride || (WD[day.d.getDay()] + ", " + MN[day.d.getMonth()] + " " + day.d.getDate());
    return '<div class="' + cls + '"><div class="day-title"><b>' + title + "</b><span>" + tag + "</span></div>" +
      slotsFor(day).map(slotHTML).join("") +
      (EXTRA[day.iso] ? '<div class="extra">' + esc(EXTRA[day.iso]) + "</div>" : "") + "</div>";
  }

  function calHTML() {
    var ym = MONTHS[ui.mi], y = ym[0], m = ym[1];
    var first = new Date(y, m, 1).getDay(), count = new Date(y, m + 1, 0).getDate();
    var h = '<div class="cal"><div class="cal-head">' +
      '<button class="nav" type="button" data-nav="-1" aria-label="Previous month"' + (ui.mi === 0 ? " disabled" : "") + ">&#8249;</button>" +
      "<h2><span>" + y + "</span>" + MN[m] + "</h2>" +
      '<button class="nav" type="button" data-nav="1" aria-label="Next month"' + (ui.mi === MONTHS.length - 1 ? " disabled" : "") + ">&#8250;</button></div>" +
      '<div class="grid">' + WD3.map(function (w) { return '<div class="dow">' + w + "</div>"; }).join("");
    for (var b = 0; b < first; b++) h += '<div class="cell blank" style="cursor:default"></div>';
    for (var n = 1; n <= count; n++) {
      var iso = isoOf(y, m, n), day = byIso[iso];
      var cls = "cell " + (day ? "in" : "off") + (iso === TODAY ? " today" : "") + (iso === ui.sel ? " sel" : "");
      var dots = "", flag = "";
      if (day) {
        dots = '<span class="dots">' + slotsFor(day).map(function (s) { return '<i class="dot ' + s.plat + (state.done[s.key] ? " on" : "") + '"></i>'; }).join("") + "</span>";
        if (iso === days[0].iso) flag = '<span class="flag">x3</span>';
      }
      h += '<button type="button" class="' + cls + '" data-d="' + iso + '" aria-label="' + WD[new Date(y, m, n).getDay()] + " " + MN[m] + " " + n + '"><span class="n">' + n + "</span>" + (flag || "<span></span>") + dots + "</button>";
    }
    var tail = (7 - ((first + count) % 7)) % 7;
    for (var t = 0; t < tail; t++) h += '<div class="cell blank" style="cursor:default"></div>';
    h += '</div><div class="legend"><span><i class="dot tt on"></i>TikTok</span><span><i class="dot ig on"></i>Instagram</span><span>filled = posted</span></div></div>';
    var sel = byIso[ui.sel];
    h += '<div class="stack" style="margin-top:14px">' + (sel ? dayCard(sel) : '<p class="pre">Tap a day in the highlighted range.</p>') + "</div>";
    return h;
  }

  function listHTML() {
    var last = days.length - 1, wk = 0;
    if (byIso[TODAY]) wk = Math.floor(byIso[TODAY].idx / 7);
    else if (TODAY > days[last].iso) wk = Math.floor(last / 7);
    var week = days.slice(wk * 7, wk * 7 + 7), done = 0;
    week.forEach(function (day) { slotsFor(day).forEach(function (s) { if (state.done[s.key]) done++; }); });
    var total = week.length * 2, a = week[0].d, z = week[week.length - 1].d;
    var h = '<div class="stack"><div class="week-top"><h2>Week ' + (wk + 1) + "</h2><span>" + MN[a.getMonth()].slice(0, 3) + " " + a.getDate() + " to " + MN[z.getMonth()].slice(0, 3) + " " + z.getDate() + "</span></div>" +
      '<div class="head-row"><span>Posted this week</span><span>' + done + " of " + total + '</span></div><div class="bar"><i style="width:' + (done / total * 100) + '%"></i></div>';
    if (TODAY < days[0].iso) h += '<p class="pre">Launch is Sunday, October 18.</p>';
    week.forEach(function (day) { h += dayCard(day); });
    return h + "</div>";
  }

  var view = document.getElementById("view");
  function render() {
    view.innerHTML = ui.tab === "cal" ? calHTML() : listHTML();
    document.getElementById("tab-cal").setAttribute("aria-selected", ui.tab === "cal");
    document.getElementById("tab-list").setAttribute("aria-selected", ui.tab === "list");
  }
  function typing() { var a = document.activeElement; return a && a.tagName === "INPUT" && view.contains(a); }

  // ---- events ----
  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-tab]");
    if (t) { ui.tab = t.getAttribute("data-tab"); render(); return; }
    var nv = e.target.closest("[data-nav]");
    if (nv) { ui.mi = Math.max(0, Math.min(MONTHS.length - 1, ui.mi + +nv.getAttribute("data-nav"))); render(); return; }
    var c = e.target.closest("[data-d]");
    if (c) { ui.sel = c.getAttribute("data-d"); render(); return; }
    var k = e.target.closest(".chk");
    if (k) {
      var key = k.getAttribute("data-k");
      if (state.done[key]) delete state.done[key]; else state.done[key] = true;
      queueSave(); render();
    }
  });
  view.addEventListener("input", function (e) {
    var t = e.target;
    if (t.hasAttribute("data-t")) state.time[t.getAttribute("data-t")] = t.value;
    else if (t.hasAttribute("data-l")) state.label[t.getAttribute("data-l")] = t.value;
    else return;
    queueSave();
  });

  // ---- boot ----
  var cached = lsRead(); if (cached) adopt(cached);
  render();
  try {
    if (window.claude && window.claude.use) {
      window.claude.use("db").then(function (db) {
        if (!db) return;
        docRef = db.doc("planner/main");
        docRef.onSnapshot(function (snap) {
          if (snap.metadata && snap.metadata.hasPendingWrites) return;
          if (!snap.exists) { if (cached) { dirty = true; flush(); } return; }
          var inc = snap.data();
          if (JSON.stringify(inc) === JSON.stringify(state)) return;
          adopt(inc); lsWrite();
          if (!typing()) render();
        }, function () { setStatus("Saved on this device only"); });
      }, function () {});
    }
  } catch (e) {}
})();
</script>

<script>
if ("serviceWorker" in navigator) { window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); }); }
</script>
</body>
</html>
